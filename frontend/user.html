<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Issue Management System</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">
        Issue Management System
    </div>

    <div class="topbar-right">
        <div class="user-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span id="userName">User 1</span>
        </div>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</header>

<div class="sidebar-layout">

    <aside class="sidebar">
        <a href="user.html" class="active" id="navDashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Dashboard
        </a>

        <a href="user.html" id="navMyIssues">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            My Issues
        </a>

        <a href="queries.html" id="navQueries">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            Queries
        </a>
    </aside>

    <main class="main-content">

        <div class="dashboard">

            <h1>Dashboard</h1>

            <!-- Metric Stat Cards (Screen 5) -->
            <div class="stats">
                <div class="stat-card assigned">
                    <h3>Assigned</h3>
                    <p id="assignedIssues">0</p>
                </div>

                <div class="stat-card pending">
                    <h3>Pending</h3>
                    <p id="pendingIssues">0</p>
                </div>

                <div class="stat-card completed">
                    <h3>Completed</h3>
                    <p id="completedIssues">0</p>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-container">
                <div class="table-header-row">
                    <h2>My Issues</h2>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="userIssueTable">
                    </tbody>
                </table>
            </div>

        </div>

    </main>

</div>

<script src="js/user.js"></script>

</body>
</html>
